name: e2e

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detachable:
    name: e2e-detachable
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install e2e tools
        run: sudo apt-get update && sudo apt-get install -y tmux jq sqlite3

      - name: Build opencode
        working-directory: packages/opencode
        run: bun run build

      - name: Run e2e-detachable suite
        working-directory: packages/opencode
        run: bash test/e2e-detachable.sh

      - name: Run e2e-detach-live suite
        working-directory: packages/opencode
        run: bash test/e2e-detach-live.sh