name: generate

on:
  pull_request:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Generate legacy JS SDK
        run: ./packages/sdk/js/script/build.ts

      - name: Generate client
        working-directory: packages/client
        run: bun run generate

      - name: Verify generated code is up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo ""
            echo "============================================"
            echo "Generated code is out of date."
            echo "Please run locally and push:"
            echo ""
            echo "  ./packages/sdk/js/script/build.ts"
            echo "  cd packages/client && bun run generate"
            echo "  git add -A && git commit -m \"chore: generate\" && git push"
            echo ""
            echo "============================================"
            git status --short
            exit 1
          fi